name: my-api
provider: gcp
type: gcp-cloud-run
project: my-gcp-project
region: us-central1
registry_name: my-repo              # bare Artifact Registry repo name, not a full host/path
template: go                        # expects a Dockerfile at _templates/go in your project

build:
  language: go
  version: "1.23"
  cmd: go build -o ./dist/server ./cmd/server
  env_vars:
    CGO_ENABLED: "0"
    GOOS: linux
    GOARCH: amd64
  flags:
    ldflags: ["-s", "-w"]

cloud_run:
  min_instances: 0
  max_instances: 10
  memory: 512Mi
  cpu: "1"

name: python-example
provider: gcp
type: gcp-cloud-run
project: your-gcp-project
region: us-central1
registry_name: your-repo            # bare Artifact Registry repo name, not a full host/path
template: python                    # expects a Dockerfile at _templates/python in your project
                                     # (see ./Dockerfile in this folder for a working example)

build:
  language: python
  version: "3.12"
  cmd: pip install -r requirements.txt

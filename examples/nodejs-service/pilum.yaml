name: nodejs-example
provider: gcp
type: gcp-cloud-run
project: your-gcp-project
region: us-central1
registry_name: your-repo            # bare Artifact Registry repo name, not a full host/path
template: node                      # expects a Dockerfile at _templates/node in your project
                                     # (see ./Dockerfile in this folder for a working example)

build:
  language: nodejs
  version: "22"
  cmd: npm ci --production

name: java-example
provider: gcp
type: gcp-cloud-run
project: your-gcp-project
region: us-central1
registry_name: your-repo            # bare Artifact Registry repo name, not a full host/path
template: java                      # expects a Dockerfile at _templates/java in your project
                                     # (see ./Dockerfile in this folder for a working example)

build:
  language: java
  version: "21"
  cmd: ./mvnw package -DskipTests

name: bun-example
provider: gcp
type: gcp-cloud-run
project: your-gcp-project
region: us-central1
registry_name: your-repo            # bare Artifact Registry repo name, not a full host/path
template: bun                       # expects a Dockerfile at _templates/bun in your project
                                     # (see ./Dockerfile in this folder for a working example)

build:
  language: bun
  version: "1"
  cmd: bun install --frozen-lockfile --production

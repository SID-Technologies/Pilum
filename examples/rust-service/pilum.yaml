name: rust-example
provider: gcp
type: gcp-cloud-run
project: your-gcp-project
region: us-central1
registry_name: your-repo            # bare Artifact Registry repo name, not a full host/path
template: rust                      # expects a Dockerfile at _templates/rust in your project
                                     # (see ./Dockerfile in this folder for a working example)

build:
  language: rust
  version: "1.75"
  cmd: cargo build --release

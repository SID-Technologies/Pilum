# Supported providers and their deployment services. Each provider-service
# pair must name a recipe in recipes/ (provider-service-recipe.yaml); a
# provider with no services must have exactly one recipe.
providers:
  gcp:
    name: Google Cloud Platform
    services:
      - cloud-run
      - cloud-run-job
      - cloud-run-from-image
      - artifact-registry-image
      - mig-container
  aws:
    name: Amazon Web Services
    services:
      - lambda
      - ecr-image
  azure:
    name: Microsoft Azure
    services:
      - container-apps
  homebrew:
    name: Homebrew
    services: []
  npm:
    name: npm
    services: []
  cloudflare:
    name: Cloudflare
    services:
      - pages
  # Test providers for unit tests
  test:
    name: Test Provider
    services: []
  unknown:
    name: Unknown Provider
    services: []

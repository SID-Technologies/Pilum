name: npm
description: Build and publish npm package to a registry
provider: npm
service: package

required_fields:
  - name: name
    description: Package name
    type: string
  - name: npm.scope
    description: npm scope (e.g., @sid-technologies)
    type: string
  - name: npm.token_env
    description: Environment variable name containing the auth token
    type: string

optional_fields:
  - name: npm.registry
    description: npm registry URL
    type: string
    default: "https://npm.pkg.github.com"
  - name: npm.access
    description: Package access level (restricted or public)
    type: string
    default: "restricted"

steps:
  # Step 1: Install dependencies from lockfile
  - name: install dependencies
    execution_mode: service_dir
    timeout: 120
    tags:
      - build

  # Snapshot + restore pair must run in any flow that touches set-version
  # or resolve-workspaces (both mutate the file).
  - name: snapshot package manifest
    execution_mode: service_dir
    timeout: 10
    tags:
      - build
      - deploy

  # Step 3: Set package version from release tag
  - name: set version
    execution_mode: service_dir
    timeout: 30
    tags:
      - build

  # Step 4: Build package (optional, skipped if no build cmd)
  - name: build package
    execution_mode: service_dir
    timeout: 300
    tags:
      - build

  # Step 5: Resolve workspace dependencies (pnpm only, no-op for npm/yarn/bun)
  - name: resolve workspace dependencies
    execution_mode: service_dir
    timeout: 30
    tags:
      - build

  # Step 6: Publish to npm registry
  - name: publish package
    execution_mode: service_dir
    timeout: 120
    tags:
      - deploy

  # always_run pairs with snapshot above — restores even if any prior step failed.
  - name: restore package manifest
    execution_mode: service_dir
    timeout: 10
    always_run: true
    tags:
      - build
      - deploy

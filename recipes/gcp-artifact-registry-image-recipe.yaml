# Build + publish a Docker image to GCP Artifact Registry. No deploy step.
name: gcp-artifact-registry-image
description: Build a Docker image and publish it to GCP Artifact Registry (no deploy)
provider: gcp
service: artifact-registry-image

required_fields:
  - name: project
    description: GCP project ID
    type: string

  - name: region
    description: GCP region (e.g., us-central1, us)
    type: string

  - name: name
    description: Pilum service name
    type: string

  - name: registry_name
    description: Artifact Registry repository name
    type: string

  - name: template
    description: Dockerfile template name (path relative to _templates directory)
    type: string

optional_fields:
  - name: image_name
    description: Image name within the repository. Defaults to service name.
    type: string
    default: ""

  - name: version
    description: Image tag (e.g., v0.1.0). Defaults to "latest".
    type: string
    default: latest

steps:
  - name: build binary
    execution_mode: service_dir
    timeout: 300
    tags:
      - build

  - name: build docker image
    execution_mode: root
    timeout: 300
    tags:
      - build

  - name: publish to registry
    execution_mode: root
    timeout: 120
    tags:
      - push

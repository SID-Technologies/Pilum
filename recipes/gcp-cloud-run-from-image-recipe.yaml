# Deploy a Cloud Run service from a pre-built image. No build, no push.
name: gcp-cloud-run-from-image
description: Deploy a Cloud Run service from a pre-built image (no build/push)
provider: gcp
service: cloud-run-from-image

required_fields:
  - name: project
    description: GCP project ID
    type: string

  - name: region
    description: GCP region (e.g., us-central1)
    type: string

  - name: name
    description: Cloud Run service name
    type: string

  - name: image
    description: Fully-qualified image reference to deploy
    type: string

optional_fields:
  - name: cloud_run.min_instances
    description: Minimum instances (0 for scale to zero)
    type: int
    default: "0"

  - name: cloud_run.max_instances
    description: Maximum instances to scale to
    type: int
    default: "10"

  - name: cloud_run.cpu_throttling
    description: Throttle CPU when not processing requests
    type: bool
    default: "true"

  - name: cloud_run.memory
    description: Memory per instance (e.g., 512Mi, 1Gi)
    type: string
    default: "512Mi"

  - name: cloud_run.cpu
    description: CPUs per instance
    type: string
    default: "1"

  - name: cloud_run.concurrency
    description: Max concurrent requests per instance
    type: int
    default: "80"

  - name: cloud_run.timeout_seconds
    description: Request timeout in seconds
    type: int
    default: "300"

  - name: cloud_run.port
    description: Ingress container port. Required when `sidecars:` is set (falls back to 8080 there); single-container deploys pass --port only when set.
    type: int
    default: "8080"

  - name: cloud_run.use_http2
    description: Serve the ingress container end-to-end over HTTP/2 (cleartext h2c) via --use-http2. The container must speak h2c. Unset passes nothing, so removing it later does not turn HTTP/2 off.
    type: bool
    default: "false"

  - name: sidecars
    description: Auxiliary containers to co-deploy in the same Cloud Run revision.
    type: list

steps:
  - name: deploy from image
    execution_mode: root
    timeout: 180
    default_retries: 2
    tags:
      - deploy

  # A rollback pins traffic to a named revision, and while pinned, new
  # deploys receive no traffic. Routing to latest makes "deploy" mean "serve
  # this", and resets any hand-made traffic split.
  - name: route traffic to latest
    execution_mode: root
    timeout: 120
    default_retries: 2
    tags:
      - deploy

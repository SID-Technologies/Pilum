# Fixture for the gcp-artifact-registry-image recipe type. This service
# only builds + publishes an image; there's no deploy step. Used by
# test_new_recipes.sh to verify the recipe dispatches and the image-name
# override (image_name + version) takes effect.
name: shared-platform-image
type: gcp-artifact-registry-image
provider: gcp
project: test-project
region: us-central1
registry_name: shared-images

# image_name + version override: published image is `platform-base:v0.5.0`,
# NOT `shared-platform-image:latest`.
image_name: platform-base
version: v0.5.0

template: golang-api.v1.dockerfile

build:
  language: go
  cmd: "echo 'Building platform-base...' && sleep 0.5 && echo 'Build complete'"
